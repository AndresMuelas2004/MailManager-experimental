name: mailmanager

services:
  postgres:
    # H4: pinned by exact tag + multi-arch index digest. Same major (16.x) as
    # before, so the existing mailmanager_pgdata volume stays compatible with no
    # migration. Tag and digest move together (digest is authoritative).
    image: postgres:16.14@sha256:081f1bc7bd5e143dbb6e487b710bbc27712cdcfaced4c071b8e47349aa1b4171
    restart: unless-stopped
    environment:
      POSTGRES_USER: mailmanager
      # Parametrised so production injects a strong password via the environment
      # (.env.production) while dev keeps the existing value. The hardening that
      # removes the published `ports` below + a strong password lands in
      # compose.prod.yml (Fase 2); doing it here would break the host test suite,
      # which reaches Postgres at localhost:5432.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mailmanager}
      POSTGRES_DB: mailmanager
    ports:
      - "5432:5432"
    volumes:
      - mailmanager_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mailmanager -d mailmanager"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      # Multi-stage: dev keeps the hot-reload image; prod is built by
      # compose.prod.yml (target: prod). The image name is unchanged, so the
      # worktree stacks that share `mailmanager-backend:latest` keep working.
      target: dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.docker
    environment:
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./backend:/app
      - ./frontend:/frontend:ro
      - "C:/Users/MiniPC/Desktop/SecureCredentials/MailApp:/secrets:ro"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      uvicorn api.app:app
      --host 0.0.0.0
      --port 8000
      --reload
      --reload-dir /app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    environment:
      CHOKIDAR_USEPOLLING: "true"

volumes:
  mailmanager_pgdata:

networks:
  # Pin the subnet so the gateway IP (10.89.42.1) is deterministic across
  # `compose down`/`up`. The backend's DEV_LOGIN_TRUSTED_HOSTS relies on it:
  # browser requests arrive at uvicorn from this gateway, not from 127.0.0.1.
  default:
    ipam:
      config:
        - subnet: 10.89.42.0/24
          gateway: 10.89.42.1
